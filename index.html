<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>For My Love ❤️</title>

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: linear-gradient(to right, #ff758c, #ff7eb3);
    color: white;
    text-align: center;
    overflow: hidden;
}

#game {
    height: 100vh;
    position: relative;
}

#heart {
    font-size: 60px;
    position: absolute;
    cursor: pointer;
    transition: 0.3s;
}

#message {
    display: none;
    padding: 40px;
}

.card {
    background: rgba(255,255,255,0.15);
    padding: 30px;
    border-radius: 20px;
    backdrop-filter: blur(10px);
    max-width: 600px;
    margin: auto;
}

img {
    width: 200px;
    border-radius: 20px;
    margin-bottom: 20px;
}
</style>
</head>

<body>

<div id="game">
    <h2> اكبسي على القلب سريعا  💖</h2>
    <div id="heart">❤️</div>
</div>

<div id="message">
    <div class="card">
        <img src="yourphoto.jpg" alt="Our Love">
        <h1>  يلا نطلع نوكل </h1>
        
        
        <p><i>With all love, Anas</i></p>
    </div>
</div>

<script>
let heart = document.getElementById("heart");
let count = 0;

function moveHeart() {
    let x = Math.random() * (window.innerWidth - 100);
    let y = Math.random() * (window.innerHeight - 100);
    heart.style.left = x + "px";
    heart.style.top = y + "px";
}

heart.addEventListener("click", function() {
    count++;
    if(count >= 5){
        document.getElementById("game").style.display = "none";
        document.getElementById("message").style.display = "block";
    } else {
        moveHeart();
    }
});

moveHeart();
</script>

</body>
</html>
